<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css"/>

    <script type="module" src="../js/checkout.js"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

      <main class="divider checkout">
    <section class="checkout-form">
  <h1>Checkout</h1>

  <form name="checkout" id="checkoutForm">

    <input type="hidden" name="orderDate" id="orderDate">

    <!-- Customer Information -->
    <fieldset>
      <legend>Customer Name</legend>

      <div class="checkout__name">
        <div class="form-group">
          <label for="fname">First Name</label>
          <input type="text" name="fname" id="fname" required>
        </div>

        <div class="form-group">
          <label for="lname">Last Name</label>
          <input type="text" name="lname" id="lname" required>
        </div>
      </div>
    </fieldset>

    <!-- Address -->
    <fieldset>
      <legend>Address</legend>

      <div class="checkout__address">

        <div class="form-group form-group--full">
          <label for="street">Street Address</label>
          <input type="text" name="street" id="street" required>
        </div>

        <div class="form-group">
          <label for="city">City</label>
          <input type="text" name="city" id="city" required>
        </div>

        <div class="form-group">
          <label for="state">State</label>
          <input type="text" name="state" id="state" required>
        </div>

        <div class="form-group">
          <label for="zip">Zip Code</label>
          <input type="text" name="zip" id="zip" required>
        </div>

      </div>
    </fieldset>

    <!-- Payment -->
    <fieldset>
      <legend>Payment</legend>

      <div class="checkout__payment">

        <div class="form-group form-group--full">
          <label for="cardNumber">Credit Card Number</label>
          <input
            type="text"
            name="cardNumber"
            id="cardNumber"
            required
          >
        </div>

        <div class="form-group">
          <label for="expiration">Expiration Date</label>
          <input
            type="text"
            name="expiration"
            id="expiration"
            placeholder="MM/YY"
            required
          >
        </div>

        <div class="form-group">
          <label for="code">Security Code</label>
          <input
            type="text"
            name="code"
            id="code"
            required
          >
        </div>

      </div>
    </fieldset>

    <!-- Order Summary -->
    <fieldset class="checkout-summary">
      <legend>Order Summary</legend>

      <div class="order__summary">

        <span>Subtotal</span>
        <span id="cartTotal">$0.00</span>

        <span>Tax</span>
        <span id="tax">$0.00</span>

        <span>Shipping Estimate</span>
        <span id="shipping">$0.00</span>

        <strong>Order Total</strong>
        <strong id="orderTotal">$0.00</strong>

      </div>
    </fieldset>

    <button type="submit" id="checkoutSubmit">
      Checkout
    </button>

  </form>
</section>
  </main>

    <footer id="main-footer"></footer>
  </body>
</html>
